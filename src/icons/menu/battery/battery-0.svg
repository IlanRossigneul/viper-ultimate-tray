<?xml version="1.0" encoding="UTF-8"?>
<svg
    xmlns="http://www.w3.org/2000/svg"
    width="256"
    height="256"
    viewBox="0 0 256 256"
>
    <!-- Battery body -->
    <rect
        id="battery-outline"
        x="7.5"
        y="78"
        width="225"
        height="100"
        rx="25"
        fill="none"
        stroke="#FF0000"
        stroke-width="15"
    />

    <!-- Battery terminal -->
    <rect
        id="battery-terminal"
        x="232"
        y="103"
        width="24"
        height="50"
        rx="10"
        fill="#FF0000"
    />

    <!-- 10% battery level -->
    <rect
        id="battery-level-10"
        x="30"
        y="98"
        width="18"
        height="60"
        rx="5"
        fill="#FF0000"
    />
</svg>
