<?xml version="1.0" encoding="UTF-8"?>
<svg
    xmlns="http://www.w3.org/2000/svg"
    width="256"
    height="256"
    viewBox="0 0 256 256"
>
    <!-- Battery body -->
    <rect
        id="battery-outline"
        x="7.5"
        y="78"
        width="225"
        height="100"
        rx="25"
        fill="none"
        stroke="#FFFF00"
        stroke-width="15"
    />

    <!-- Battery terminal -->
    <rect
        id="battery-terminal"
        x="232"
        y="103"
        width="24"
        height="50"
        rx="10"
        fill="#FFFF00"
    />

    <!-- 25% battery level -->
    <rect
        id="battery-level-25"
        x="30"
        y="98"
        width="45"
        height="60"
        rx="5"
        fill="#FFFF00"
    />

    <!-- Charging bolt -->
    <path
        id="battery-bolt"
        d="M 125.82 58 L 74.14 123.90 H 104.85 L 88.00 198 L 153.63 118.67 H 125.82 Z"
        fill="#FFFF00"
        stroke="#000000"
        stroke-width="3"
        stroke-linejoin="round"
    />
</svg>
